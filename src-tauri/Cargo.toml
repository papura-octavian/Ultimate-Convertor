[package]
name = "ultimate-convertor"
version = "1.0.0"
description = "Convert images, video, audio, data and documents fast"
authors = ["papura-octavian"]
license = "MIT"
edition = "2021"

[lib]
name = "ultimate_convertor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
toml = { version = "0.8", features = ["preserve_order"] }
csv = "1"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
image = { version = "0.25", default-features = false, features = [
    "png", "jpeg", "gif", "bmp", "ico", "tiff", "webp", "tga", "qoi", "pnm", "hdr", "exr", "dds", "rayon",
] }
webp = { version = "0.3", default-features = false }
base64 = "0.22"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"

# Image codecs are painfully slow unoptimized; keep dev builds usable.
[profile.dev.package."*"]
opt-level = 3
